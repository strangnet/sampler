[package]
name = "sampler"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
gpui = { version = "0.2.2", features = ["runtime_shaders"] }
hound = "3.5"
rodio = { version = "0.20", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
screencapturekit = { version = "1", features = ["macos_13_0"] }
bytemuck = "1.21"

[dev-dependencies]
hound = "3.5"
gpui = { version = "0.2.2", features = ["runtime_shaders", "test-support"] }
rstest = "0.28.0"
tempfile = "3"
